<header class="app-header">
  <img src="favicon.svg" class="app-logo" alt="" aria-hidden="true" width="28" height="28">
  <span class="app-title">{{ title }}</span>
  <span class="local-badge" [class.local-badge--recording]="!!transcription?.isRecording" title="Audio is transcribed on this device"><i class="ph-fill" [class.ph-record]="!!transcription?.isRecording" [class.ph-shield-check]="!transcription?.isRecording" aria-hidden="true"></i> {{ transcription?.isRecording ? 'Recording' : transcription?.isTranscribing ? 'Transcribing' : 'On device' }}</span>
</header>

<div class="app-container">
  <div class="tabs">
    <div class="tabs__list" role="tablist" aria-label="Main navigation">
      <button
        class="tabs__tab"
        role="tab"
        id="app-tab-transcription"
        aria-controls="app-panel-transcription"
        [attr.tabindex]="activeTab === 0 ? 0 : -1"
        (keydown)="onAppTabKeydown($event)"
        [attr.aria-selected]="activeTab === 0"
        (click)="activeTab = 0"
        >
        Transcription
      </button>
      <button
        class="tabs__tab"
        role="tab"
        id="app-tab-models"
        [disabled]="!!transcription?.busy"
        [title]="transcription?.busy ? 'Finish the current recording or transcription first' : 'Manage speech models'"
        aria-controls="app-panel-models"
        [attr.tabindex]="activeTab === 1 ? 0 : -1"
        (keydown)="onAppTabKeydown($event)"
        [attr.aria-selected]="activeTab === 1"
        (click)="activeTab = 1"
        >
        Models
      </button>
      <button
        class="tabs__tab"
        role="tab"
        id="app-tab-history"
        [disabled]="!!transcription?.busy"
        [title]="transcription?.busy ? 'Finish the current recording or transcription first' : 'Recent transcripts'"
        aria-controls="app-panel-history"
        [attr.tabindex]="activeTab === 2 ? 0 : -1"
        (keydown)="onAppTabKeydown($event)"
        [attr.aria-selected]="activeTab === 2"
        (click)="activeTab = 2"
        >
        History
      </button>
    </div>
    <div class="tabs__panels">
      <div id="app-panel-transcription" role="tabpanel" aria-labelledby="app-tab-transcription" [hidden]="activeTab !== 0">
        <app-transcription (manageModels)="activeTab = 1"></app-transcription>
      </div>
      <div id="app-panel-models" role="tabpanel" aria-labelledby="app-tab-models" [hidden]="activeTab !== 1">
        <app-model-selector></app-model-selector>
      </div>
      <div id="app-panel-history" role="tabpanel" aria-labelledby="app-tab-history" [hidden]="activeTab !== 2">
        <app-history></app-history>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" aria-live="polite" aria-atomic="false">
  @for (toast of toastService.toasts$ | async; track toast) {
    <div
      class="toast toast--{{ toast.variant }}"
      [attr.role]="toast.variant === 'warning' || toast.variant === 'error' ? 'alert' : 'status'"
      >
      <svg class="toast__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        @if (toast.variant === 'info') {
          <ng-container>
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </ng-container>
        }
        @if (toast.variant === 'success') {
          <ng-container>
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </ng-container>
        }
        @if (toast.variant === 'warning') {
          <ng-container>
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </ng-container>
        }
        @if (toast.variant === 'error') {
          <ng-container>
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
          </ng-container>
        }
      </svg>
      <div class="toast__content">
        <p class="toast__message">{{ toast.message }}</p>
      </div>
      <button
        class="toast__dismiss"
        (click)="toastService.dismiss(toast.id)"
        aria-label="Dismiss"
        >
        <i class="ph-bold ph-x" aria-hidden="true"></i>
      </button>
    </div>
  }
</div>
