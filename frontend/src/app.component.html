<header class="app-header">
  <img src="favicon.svg" class="app-logo" alt="" aria-hidden="true" width="28" height="28">
  <span class="app-title">{{ title }}</span>
  <div class="theme-control">
    <fieldset id="theme-control" class="theme-track" role="radiogroup" aria-labelledby="theme-legend" (keydown)="onThemeKeydown($event)">
      <legend id="theme-legend" class="theme-legend">Theme</legend>
      @for (option of themeOptions; track option.value) {
        <candor-tooltip [text]="option.value === 'system' ? 'Follow system appearance' : option.label + ' theme'" position="bottom">
          <label class="theme-option">
            <input type="radio" name="appearance" [value]="option.value" [attr.aria-label]="option.label" [attr.aria-description]="option.value === 'system' ? 'Follows the light or dark appearance of your device.' : null" [checked]="themePreference === option.value" (change)="onThemeChange($event)">
            <span class="theme-choice" aria-hidden="true"><i [class]="'ph-bold ph-' + option.icon" aria-hidden="true"></i></span>
          </label>
        </candor-tooltip>
      }
    </fieldset>
  </div>
  <span class="local-badge" [class.local-badge--recording]="!!transcription?.isRecording"><i class="ph-bold" [class.ph-record]="!!transcription?.isRecording" [class.ph-waveform]="!!transcription?.isTranscribing" [class.ph-shield-check]="!transcription?.isRecording && !transcription?.isTranscribing" aria-hidden="true"></i> {{ transcription?.isRecording ? 'Recording' : transcription?.isTranscribing ? 'Transcribing' : 'On device' }}</span>
</header>

<div class="app-container">
  <div class="tabs">
    <div class="tabs__list" role="tablist" aria-label="Main navigation">
      <button
        class="tabs__tab"
        role="tab"
        id="app-tab-transcription"
        aria-controls="app-panel-transcription"
        [attr.tabindex]="activeTab === 0 ? 0 : -1"
        (keydown)="onAppTabKeydown($event)"
        [attr.aria-selected]="activeTab === 0"
        (click)="activeTab = 0"
        >
        <i class="ph-fill ph-microphone" aria-hidden="true"></i> Transcription
      </button>
      <button
        class="tabs__tab"
        role="tab"
        id="app-tab-models"
        aria-controls="app-panel-models"
        [attr.tabindex]="activeTab === 1 ? 0 : -1"
        (keydown)="onAppTabKeydown($event)"
        [attr.aria-selected]="activeTab === 1"
        (click)="activeTab = 1"
        >
        <i class="ph-fill ph-cpu" aria-hidden="true"></i> Models
      </button>
      <button
        class="tabs__tab"
        role="tab"
        id="app-tab-history"
        aria-controls="app-panel-history"
        [attr.tabindex]="activeTab === 2 ? 0 : -1"
        (keydown)="onAppTabKeydown($event)"
        [attr.aria-selected]="activeTab === 2"
        (click)="activeTab = 2"
        >
        <i class="ph-bold ph-clock-counter-clockwise" aria-hidden="true"></i> History
      </button>
    </div>
    <div class="tabs__panels">
      <div id="app-panel-transcription" role="tabpanel" aria-labelledby="app-tab-transcription" [hidden]="activeTab !== 0">
        <app-transcription (manageModels)="activeTab = 1"></app-transcription>
      </div>
      <div id="app-panel-models" role="tabpanel" aria-labelledby="app-tab-models" [hidden]="activeTab !== 1">
        <app-model-selector></app-model-selector>
      </div>
      <div id="app-panel-history" role="tabpanel" aria-labelledby="app-tab-history" [hidden]="activeTab !== 2">
        <app-history></app-history>
      </div>
    </div>
  </div>
</div>

<candor-toast-container class="toast-container" position="top-right">
  @for (toast of toastService.toasts$ | async; track toast.id) {
    <candor-toast [message]="toast.message" [variant]="toast.variant" [dismissible]="true" (dismiss)="toastService.dismiss(toast.id)"></candor-toast>
  }
</candor-toast-container>
