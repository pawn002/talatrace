name: Linux CPU packages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install build and desktop test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config xz-utils libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libxtst6 libnotify4 libsecret-1-0 xvfb xauth libfuse2t64
      - run: npm run setup
      - run: node scripts/prepare-smoke-models.cjs
      - run: npm test
      - run: npm run build
      - run: npm run test:speech-activity
      - name: Build AppImage and deb without publishing
        run: npx electron-builder --linux --x64 --publish never
      - name: Install deb and verify its shipped sandbox setup
        run: |
          sudo apt-get install -y --no-install-recommends ./release/TalaTrace-*-linux-amd64.deb
          test "$(stat -c '%u:%g:%a' /opt/TalaTrace/chrome-sandbox)" = '0:0:4755'
          test -r /etc/apparmor.d/talatrace
          sudo apparmor_parser --skip-kernel-load --skip-read-cache /etc/apparmor.d/talatrace
          if sudo apparmor_status --enabled; then
            cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns
            export TALATRACE_EXPECT_APPARMOR=1
          fi
          xvfb-run -a node tests/electron/packaged-release-smoke.cjs /opt/TalaTrace/whisper-electron-app
      - name: Remove installed test package
        if: always()
        run: |
          if dpkg-query -W -f='${Status}' whisper-electron-app 2>/dev/null | grep -q 'install ok installed'; then
            sudo apt-get purge -y whisper-electron-app
            test ! -e /etc/apparmor.d/talatrace
            test ! -e /opt/TalaTrace/whisper-electron-app
            if sudo apparmor_status --enabled; then
              if sudo grep -q '^talatrace ' /sys/kernel/security/apparmor/profiles; then
                echo 'TalaTrace AppArmor profile remained loaded after purge' >&2
                exit 1
              fi
            fi
          fi
      - name: Allow Chromium user namespaces for these CI binaries on Ubuntu
        run: |
          if command -v apparmor_parser >/dev/null && sudo aa-status --enabled; then
            cat > "$RUNNER_TEMP/talatrace-ci-apparmor" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile talatrace-ci "$GITHUB_WORKSPACE/{node_modules/electron/dist/electron,release/linux-unpacked/whisper-electron-app}" flags=(unconfined) {
            userns,
            network,
          }
          EOF
            sudo apparmor_parser -r "$RUNNER_TEMP/talatrace-ci-apparmor"
          fi
      - name: Configure packaged Chromium sandbox
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
      - name: Offline packaged engines, preference restart and clean profile
        run: xvfb-run -a node tests/electron/packaged-release-smoke.cjs release/linux-unpacked/whisper-electron-app
      - name: Configure development Chromium sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Real MediaRecorder workflow with fake reference microphone
        run: xvfb-run -a npm run test:interview-smoke
      - name: Checksums
        run: sha256sum release/*.AppImage release/*.deb > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: talatrace-linux-x64-candidate
          path: |
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS.txt
          if-no-files-found: error
